 if(o.t==='boss'){o.w=28;o.h=30;o.x=e.x*16;o.y=e.y*16-14;o.hp=5;o.vx=-.4;o.fireT=120;o.jumpT=90;o.minX=(e.x-6)*16;o.maxX=(e.x+2)*16;}}
// tiles
function tileAt(tx,ty){if(tx<0)return 'X';if(tx>=area.w)return '.';if(ty<0||ty>=ROWS)return '.';return area.g[ty][tx];}
function solid(tx,ty){if(ty<0)return tx<0;return SOLID.has(tileAt(tx,ty));}
function phys(o,grav=.35,maxF=4.5){let hitW=0,heads=[];o.x+=o.vx;
 const y0=Math.floor((o.y+1)/16),y1=Math.floor((o.y+o.h-1)/16);
 if(o.vx>0){const tx=Math.floor((o.x+o.w)/16);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){o.x=tx*16-o.w;hitW=1;break;}}
 else if(o.vx<0){const tx=Math.floor(o.x/16);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){o.x=(tx+1)*16;hitW=-1;break;}}
 o.vy=Math.min(o.vy+grav,maxF);o.y+=o.vy;o.onG=0;
 const x0=Math.floor((o.x+1)/16),x1=Math.floor((o.x+o.w-1)/16);
 if(o.vy>=0){const ty=Math.floor((o.y+o.h)/16);for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){o.y=ty*16-o.h;o.vy=0;o.onG=1;break;}}
 else{const ty=Math.floor(o.y/16);for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty))heads.push(tx);if(heads.length){o.y=(ty+1)*16;o.vy=0;o.headY=ty;}}
 return{hitW,heads};}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function addScore(n,x,y){score+=n;if(x!=null)pops.push({x,y,t:0,s:n>=1000&&n%1000===0&&n!==1000?n:n===-1?'1UP':n});}
function oneUp(x,y){lives++;SFX.oneup();pops.push({x,y,t:0,s:'1UP'});}
function getCoin(x,y,fromBlock){coinCount++;score+=200;SFX.coin();if(coinCount>=100){coinCount-=100;oneUp(P.x,P.y-10);}
 if(fromBlock)parts.push({k:'coin',x,y,vx:0,vy:-5,t:0,life:34});else for(let i=0;i<6;i++)parts.push({k:'spark',x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,t:0,life:20});}
function bumpTile(tx,ty){const c=tileAt(tx,ty),key=tx+','+ty;
 // enemies on top
 for(const e of ents)if(e.act&&!e.dead&&(e.t==='g'||e.t==='k')&&e.x+e.w>tx*16&&e.x<tx*16+16&&Math.abs(e.y+e.h-ty*16)<3)killFlip(e,P.x<e.x?1:-1,100);
 for(const e of ents)if(e.t==='coinItem'||e.t==='item'){if(e.x+e.w>tx*16&&e.x<tx*16+16&&Math.abs(e.y+e.h-ty*16)<3){e.vy=-3;e.vx=Math.abs(e.vx||1)*(e.x+8>tx*16+8?1:-1);}}
 if(c==='?'){area.g[ty][tx]='U';area.bumps[key]=10;getCoin(tx*16+8,ty*16-8,1);}
 else if(c==='M'||c==='*'||c==='1'){area.g[ty][tx]='U';area.bumps[key]=10;SFX.sprout();
  const kind=c==='*'?'star':c==='1'?'life':(P.big?'flower':'grow');ents.push({t:'item',kind,x:tx*16+1,y:ty*16,w:14,h:14,vx:0,vy:0,rise:16,act:1,px:tx*16,py:ty*16,face:1});}
 else if(c==='C'){const n=(area.coinsLeft[key]=(area.coinsLeft[key]??10)-1);getCoin(tx*16+8,ty*16-8,1);area.bumps[key]=10;if(n<=0)area.g[ty][tx]='U';}
 else if(c==='B'){if(P.big){area.g[ty][tx]='.';SFX.brk();addScore(50);shake=4;for(let i=0;i<4;i++)parts.push({k:'brick',x:tx*16+4+(i%2)*8,y:ty*16+4+(i>>1)*8,vx:(i%2?1.2:-1.2),vy:i>>1?-3:-5,t:0,life:80,r:0});}
  else{area.bumps[key]=10;SFX.bump();}}
 else SFX.bump();
 if(tileAt(tx,ty-1)==='c'){area.g[ty-1][tx]='.';getCoin(tx*16+8,ty*16-16,1);}}

function hurt(){if(Q.get("god")||P.inv>0||P.star>0||P.dead)return;if(P.big){if(P.fire){P.fire=0;}else setBig(P,0);P.fire=0;P.inv=120;SFX.shrink();shake=6;}else die();}

 if(p.dead){stateT++;if(stateT>30){p.vy+=.3;p.y+=p.vy;}if(stateT>170){lives--;startBig=0;startFire=0;if(lives<=0){saveHi();state='gameover';stateT=0;stopMusic();}else{state='intro';stateT=0;}}return;}
 if(p.pipeAnim){const a=p.pipeAnim;a.t++;if(a.dir==='down')p.y+=.8;else p.y-=.8;if(a.t>40){const d=a.dest;p.pipeAnim=null;
   const tgt=d.area==='main'?main:main.areas[d.area];if(d.up){enterArea(tgt,d.x,9*16);}else enterArea(tgt,tgt.startX,2*16);}
  return;}
 if(flagS){updateFlag();return;}
 if(p.grow>0){p.grow--;return;}
 const run=K.run,dir=(K.right?1:0)-(K.left?1:0);p.ducking=p.big&&K.down&&p.onG;
 const maxV=run?2.6:1.55;let acc=p.onG?(run?.075:.055):.05;
 p.skid=0;
 if(dir&&!p.ducking){if(p.vx*dir<0){p.vx+=dir*(p.onG?.2:.1);if(p.onG&&Math.abs(p.vx)>.6){p.skid=1;if(frame%4===0)dust(p.x+p.w/2,p.y+p.h,1);}}
  else if(Math.abs(p.vx)<maxV)p.vx+=dir*acc*(1-.5*Math.pow(Math.abs(p.vx)/maxV,2));else if(p.onG)p.vx-=Math.sign(p.vx)*.04;

 // coyote & buffer
 p.coy=p.onG?6:Math.max(0,p.coy-1);if(K.jumpP)p.buf=7;else p.buf=Math.max(0,p.buf-1);
 if(p.buf&&p.coy){p.vy=-(4.6+Math.min(Math.abs(p.vx),2.6)*.32);p.jt=1;p.coy=0;p.buf=0;p.onG=0;p.lift=null;p.sq=1.25;p.big?SFX.bigjump():SFX.jump();dust(p.x+p.w/2,p.y+p.h,3);}

 // fire

 p.fireCd--;p.throwT--;
 const wasG=p.onG,vyB=p.vy;
 // lift carry
 if(p.lift){p.x+=p.lift.x-p.lift.px;p.y=p.lift.y-p.h;}
 const r=phys(p,grav,4.5);
 if(p.lift){if(p.x+p.w<p.lift.x||p.x>p.lift.x+p.lift.w||p.vy<0)p.lift=null;else{p.onG=1;p.vy=0;p.y=p.lift.y-p.h;}}
 for(const l of ents)if(l.t==='lift'&&!p.lift&&p.vy>=0&&p.x+p.w>l.x&&p.x<l.x+l.w&&p.py+p.h<=l.py+3&&p.y+p.h>=l.y){p.lift=l;p.y=l.y-p.h;p.vy=0;p.onG=1;}
 if(p.x<cam.x)p.x=cam.x,p.vx=Math.max(0,p.vx);
 if(r.hitW)p.vx=0;
 if(r.heads.length){const cx=p.x+p.w/2;let best=r.heads[0];for(const tx of r.heads)if(Math.abs(tx*16+8-cx)<Math.abs(best*16+8-cx))best=tx;bumpTile(best,p.headY);p.jt=0;}
 if(p.onG&&!wasG&&vyB>2){p.sq=.72;dust(p.x+p.w/2,p.y+p.h,4);}
 p.sq+=(1-p.sq)*.22;
 if(p.onG)p.ph+=Math.abs(p.vx)*.18;p.blink=(frame%220)<7;
 if(p.inv>0)p.inv--;if(p.star>0){p.star--;if(frame%3===0)parts.push({k:'spark',x:p.x+Math.random()*p.w,y:p.y+Math.random()*p.h,vx:0,vy:-.3,t:0,life:22});if(p.star===0)playMusic(area.music);}
 // coins tiles
 for(let tx=Math.floor(p.x/16);tx<=Math.floor((p.x+p.w)/16);tx++)for(let ty=Math.floor(p.y/16);ty<=Math.floor((p.y+p.h-1)/16);ty++){const c=tileAt(tx,ty);
  if(c==='c'){area.g[ty][tx]='.';getCoin(tx*16+8,ty*16+8);}if(c==='L'&&p.y+p.h>ty*16+6)die();if(c==='A'&&!bridgeS)startBridge();}
 if(p.y>ROWS*16+20)die();if(area.axeX&&p.x+p.w>area.axeX*16+3&&!bridgeS)startBridge();if(p.x>area.w*16-p.w)p.x=area.w*16-p.w;
 // pipes
 if(K.down&&p.onG){const tx=Math.floor((p.x+p.w/2)/16),ty=Math.floor((p.y+p.h+1)/16),c=tileAt(tx,ty);let px=c==='P'?tx:c==='Q'?tx-1:-1;
  if(px>=0&&area.pipes[px]&&Math.abs(p.x+p.w/2-(px*16+16))<8){p.pipeAnim={t:0,dir:'down',dest:area.pipes[px],top:ty*16};p.vx=0;SFX.pipe();}}
 // flag
 if(area.flagX&&p.x+p.w>area.flagX*16+7){flagS={ph:0,t:0,h:Math.max(0,12*16-(p.y+p.h))};p.x=area.flagX*16+7-p.w+2;p.vx=0;p.vy=0;stopMusic();SFX.flag();
  const h=flagS.h,pts=h>110?5000:h>80?2000:h>50?800:h>25?400:100;addScore(pts,p.x+16,p.y);}}
function updateFlag(){const p=P;flagS.t++;
 if(flagS.ph===0){if(p.y+p.h<12*16){p.y=Math.min(p.y+2,12*16-p.h);}else if(flagS.t>50){flagS.ph=1;p.x+=10;p.face=1;}}
 else if(flagS.ph===1){p.vx=1.2;const r=phys(p,.35);p.face=1;p.ph+=.22;if(p.x>area.castleX*16+16){flagS.ph=2;flagS.t=0;}}
 else if(flagS.ph===2){if(timeLeft>0){const d=Math.min(timeLeft,3);timeLeft-=d;score+=50*d;if(frame%3===0)SFX.tick();}else if(flagS.t>60)nextLevel();}}
function startBridge(){bridgeS={t:0,i:area.bridge[1]};stopMusic();P.vx=0;}
function updateBridge(){bridgeS.t++;P.px=P.x;P.py=P.y;if(bridgeS.t%5===0&&bridgeS.i>=area.bridge[0]){area.g[9][bridgeS.i]='.';SFX.bridge();bridgeS.i--;}
 const b=ents.find(e=>e.t==='boss'&&!e.dead);if(b&&bridgeS.i<area.bridge[0]+2){b.dead=3;b.vy=0;addScore(5000,b.x,b.y);SFX.bossHit();}
 for(const e of ents)if(e.t==='boss'&&e.dead===3){e.vy+=.2;e.y+=e.vy;}
 if(bridgeS.t>140&&bridgeS.t<142){SFX.win();}if(bridgeS.t>140){if(timeLeft>0){const d=Math.min(timeLeft,4);timeLeft-=d;score+=50*d;}else if(bridgeS.t>330){saveHi();state='win';stateT=0;}}}

function updateEnts(){const view1=cam.x+VW+48;
 for(const e of ents){e.px=e.x;e.py=e.y;if(e.pending){if(e.x<view1&&e.x>cam.x-40)activate(e);else continue;}
  if(e.x<cam.x-160&&e.t!=='lift'&&e.t!=='bar'&&e.t!=='boss'){e.gone=1;continue;}
  if(e.dead===2){e.vy+=.3;e.y+=e.vy;e.x+=e.vx;if(e.y>300)e.gone=1;continue;}
  if(e.dead===1){e.t2=(e.t2||0)+1;if(e.t2>30)e.gone=1;continue;}
  switch(e.t){
  case 'g':{e.ph+=.15;const r=phys(e);if(r.hitW)e.vx=-e.vx;if(e.y>300)e.gone=1;break;}
  case 'k':{if(e.shell){if(e.vx===0){e.wake=(e.wake||0)+1;if(e.wake>420){e.shell=0;e.h=22;e.y-=8;e.vx=-.5;e.wake=0;}}

    if(Math.abs(e.vx)>1)for(const o of ents)if(o!==e&&o.act&&!o.dead&&(o.t==='g'||o.t==='k')&&overlap(e,o)){killFlip(o,Math.sign(e.vx),e.combo=(e.combo||100)*2>8000?8000:(e.combo||100)*2);}}
   else{e.ph+=.12;const r=phys(e);if(r.hitW)e.vx=-e.vx;
    // turn at ledges for green-ish? (classic: walks off) - keep walking off except on treetops
    if(e.onG&&area.theme==='sky'){const ax=e.vx>0?e.x+e.w+1:e.x-1;if(!solid(Math.floor(ax/16),Math.floor((e.y+e.h+2)/16)))e.vx=-e.vx;}}
   e.face=e.vx>0?1:-1;if(e.y>300)e.gone=1;break;}
  case 'item':{if(e.rise>0){e.y-=.5;e.rise-=.5;break;}
   if(e.kind==='flower')break;if(!e.vx)e.vx=e.kind==='star'?1.4:1.1;const r=phys(e,e.kind==='star'?.2:.35);if(r.hitW)e.vx=-e.vx;if(e.kind==='star'&&e.onG)e.vy=-4.5;if(e.y>300)e.gone=1;break;}
  case 'fb':{e.r+=.4;const r=phys(e,.3,4);if(e.onG)e.vy=-2.6;if(r.hitW||e.x<cam.x-10||e.x>cam.x+VW+10){e.gone=1;burst(e.x,e.y);}
   for(const o of ents)if(o.act&&!o.dead&&(o.t==='g'||o.t==='k'||o.t==='boss')&&overlap(e,o)){e.gone=1;burst(e.x,e.y);if(o.t==='boss'){o.hp--;o.flash=10;SFX.bossHit();if(o.hp<=0){o.dead=2;o.vy=-3;addScore(5000,o.x,o.y);}}else killFlip(o,Math.sign(e.vx),200);break;}break;}
  case 'lift':{e.ph+=.02;e.x=e.ox+Math.sin(e.ph)*e.r*e.dx;e.y=e.oy+Math.sin(e.ph)*e.r*e.dy;break;}
  case 'bar':{e.ang+=.045*e.dir;if(!P.dead)for(let i=0;i<e.len;i++){const x=e.x+Math.cos(e.ang)*i*8,y=e.y+Math.sin(e.ang)*i*8;if(x>P.x-2&&x<P.x+P.w+2&&y>P.y-2&&y<P.y+P.h+2){hurt();break;}}break;}
  case 'boss':{if(bridgeS)break;e.ph+=.1;if(e.flash)e.flash--;e.x+=e.vx;if(e.x<e.minX||e.x>e.maxX)e.vx=-e.vx;e.face=P.x<e.x?-1:1;
   e.jumpT--;if(e.jumpT<=0&&e.onG){e.vy=-4;e.jumpT=100+Math.random()*80;}e.vy=Math.min(e.vy+.2,4);e.y+=e.vy;if(e.y+e.h>9*16){e.y=9*16-e.h;e.vy=0;e.onG=1;}else e.onG=0;
   e.fireT--;if(e.fireT<=0&&Math.abs(P.x-e.x)<VW){e.fireT=110+Math.random()*90;ents.push({t:'flame',x:e.x-8,y:e.y+6+(Math.random()<.5?0:-10),w:20,h:7,vx:-1.6,act:1,px:e.x,py:e.y});SFX.fire();}break;}
  case 'flame':{e.x+=e.vx;if(e.x<cam.x-40)e.gone=1;break;}
  }

   if(e.kind==='grow'){if(!P.big){setBig(P,1);P.grow=30;}addScore(1000,e.x,e.y);SFX.power();}
   else if(e.kind==='flower'){if(!P.big)setBig(P,1);P.fire=1;P.grow=30;addScore(1000,e.x,e.y);SFX.power();}
   else if(e.kind==='star'){P.star=600;addScore(1000,e.x,e.y);playMusic('star');SFX.power();}
   else if(e.kind==='life')oneUp(e.x,e.y);}
  if((e.t==='flame')&&overlap(P,e))hurt();

   if(e.t==='k'&&e.shell&&e.vx===0){e.vx=(P.x+P.w/2<e.x+e.w/2)?3.4:-3.4;e.x+=e.vx*2;SFX.kick();addScore(400,e.x,e.y);e.kickT=12;if(stomp)P.vy=-3.5;continue;}
